openapi: 3.0.3
info:
  title: Noetive Platform API
  version: 0.1.0
  description: |
    Create agents, their keys and their mailboxes from your own service,
    without the dashboard.

    Every operation is a JSON `POST`, including the ones that only read.
    Any other method is answered `405`.

    ## Who may call it

    Every request carries a key as a bearer token. The key must belong to an
    agent with **May create agents and keys** turned on, on its Edit access
    page in the dashboard. That agent is the *provisioner*.

    Everything a provisioner creates belongs to the provisioner's own account.
    No request field names an account, so a key can never create anything in
    another account.

    ## What a provisioner may do

    - **It never grants more than it holds.** An agent it creates reaches at
      most the Bud scopes and namespaces the provisioner itself reaches.
    - **It cannot create provisioners.** An agent it creates can never be
      given this permission, so a leaked key cannot copy itself.
    - **It sees only what it created.** Agents made in the dashboard or by
      another provisioner are answered as `not_found`, exactly like agents
      that do not exist.

    ## A refused call leaves no agent and no working key

    `agent.create` answers only once the agent's mailbox exists, and the
    response carries its address. A call answered with a refusal has removed
    the agent and no key from it works, so it is safe to retry. After an
    `internal_error` or a dropped connection, retry too: the retry either
    succeeds or answers `name_taken` naming the agent the first attempt made.

    An address stays reserved after its agent is gone, including one from a
    create interrupted after its mailbox was set up. Asking for it again is
    answered `local_part_taken` without an `agent_id`; choose another.

    An agent must reach something: at least one Bud scope, a namespace, or the
    shared `global` namespace. A request for an agent reaching nothing is
    `invalid_request`.

    ## Retrying after a lost response

    Give each agent a `name` derived from your own record of it, such as a
    ticket or customer id. If a response is lost after the call succeeded, the
    retry is refused with `name_taken` and the `agent_id` it already created,
    and because the name is yours that id is the agent you meant. Call
    `key.rotate` with it to get a working key.

    `key.revoke` of a key that is already revoked answers `not_found`.

    ## Errors

    A refusal is a JSON object with `code` and `error`, at the HTTP status the
    code maps to. Branch on the status, then within it on the code. `error`
    is a sentence for a person and may change.

    | code | status | meaning |
    | --- | --- | --- |
    | `invalid_request` | 400 | The body is malformed, a field is wrong, or an `agent.list` cursor is not one the API issued. |
    | `missing_credential` | 401 | No bearer token arrived. |
    | `unauthorized` | 401 | The key is unknown, revoked or expired, or its agent is disabled. |
    | `not_billable` | 402 | The account cannot create mailboxes until it has a payment method. No agent or key from the call remains. |
    | `not_a_provisioner` | 403 | The key's agent does not have **May create agents and keys**. |
    | `exceeds_provisioner` | 403 | The request asks for more than the provisioner itself reaches, or, on `key.rotate`, the agent has since been given more than that in the dashboard. |
    | `not_found` | 404 | No such agent or key among those this provisioner created. |
    | `local_part_taken` | 409 | The address is in use. `agent_id` is set when this provisioner created it. |
    | `name_taken` | 409 | The name is in use in this account. `agent_id` is set when this provisioner created it. |
    | `too_many_keys` | 409 | The account holds the maximum number of live keys. Revoke one first. |
    | `conflict` | 409 | Another change to the same agent's key landed first. Retry. |
    | `rate_limited` | 429 | Too many requests, or too many `agent.create` calls running at once for this account. Wait for the `Retry-After` header's seconds. |
    | `mailbox_unavailable` | 503 | The mailbox could not be set up just now. No agent or key from the call remains; retry after the `Retry-After` header's seconds, with backoff. |
    | `internal_error` | 500 | Something went wrong that is not about the request. |
servers:
  - url: https://www.noetive.io
    description: Noetive
security:
  - bearerAuth: []
paths:
  /api/v1/agent.create:
    post:
      operationId: createAgent
      summary: Create an agent with a key and a mailbox
      description: |
        Creates an agent in the provisioner's account, gives it a key, and
        sets up its mailbox. Answers once the mailbox exists, with its
        address. The key is shown once and cannot be read back.

        The smallest request is `{"name": "…"}`: an agent with the
        provisioner's Bud scopes, no namespaces, a generated address and a
        key that never expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
            example:
              name: Ticket 4411 triage
              local_part: triage-4411
              bud_scopes: [mail]
              expires_in_days: 30
      responses:
        '200':
          description: The agent, its address and its key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAgent'
              example:
                agent_id: ag_01jb8x4m2fe0bv3c7y1tq9k2rd
                address: triage-4411@k3x9.noetiveagents.com
                key_id: key_01jb8x4m3ae0bv3c8m5n7r2wxz
                key: keya_example
                expires_at: '2026-11-26T09:00:00Z'
        '400': {$ref: '#/components/responses/Refusal'}
        '401': {$ref: '#/components/responses/Refusal'}
        '402': {$ref: '#/components/responses/Refusal'}
        '403': {$ref: '#/components/responses/Refusal'}
        '409': {$ref: '#/components/responses/Refusal'}
        '429': {$ref: '#/components/responses/Refusal'}
        '500': {$ref: '#/components/responses/Refusal'}
        '503': {$ref: '#/components/responses/Refusal'}
  /api/v1/key.rotate:
    post:
      operationId: rotateKey
      summary: Issue a fresh key for an agent
      description: |
        Gives one of the provisioner's agents a new key, shown once. The key
        it had stops working when `grace` runs out; `now` stops it in the
        same step.

        Use it after a lost `agent.create` response, or when a key may have
        leaked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateKeyRequest'
            example:
              agent_id: ag_01jb8x4m2fe0bv3c7y1tq9k2rd
              grace: now
              expires_in_days: 30
      responses:
        '200':
          description: The new key, and the agent's address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedKey'
              example:
                key_id: key_01jb8x7p1ce0bv3d2k4m6q8syv
                key: keya_example
                address: triage-4411@k3x9.noetiveagents.com
                expires_at: '2026-11-26T09:00:00Z'
                previous_key_valid_until: null
        '400': {$ref: '#/components/responses/Refusal'}
        '401': {$ref: '#/components/responses/Refusal'}
        '403': {$ref: '#/components/responses/Refusal'}
        '404': {$ref: '#/components/responses/Refusal'}
        '409': {$ref: '#/components/responses/Refusal'}
        '429': {$ref: '#/components/responses/Refusal'}
        '500': {$ref: '#/components/responses/Refusal'}
  /api/v1/key.revoke:
    post:
      operationId: revokeKey
      summary: Revoke a key
      description: |
        Stops one key belonging to an agent this provisioner created. The
        agent stays and can be given a new key with `key.rotate`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeKeyRequest'
            example:
              key_id: key_01jb8x4m3ae0bv3c8m5n7r2wxz
      responses:
        '200':
          description: The key is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400': {$ref: '#/components/responses/Refusal'}
        '401': {$ref: '#/components/responses/Refusal'}
        '403': {$ref: '#/components/responses/Refusal'}
        '404': {$ref: '#/components/responses/Refusal'}
        '429': {$ref: '#/components/responses/Refusal'}
        '500': {$ref: '#/components/responses/Refusal'}
  /api/v1/agent.delete:
    post:
      operationId: deleteAgent
      summary: Delete an agent
      description: |
        Deletes an agent this provisioner created and revokes its keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAgentRequest'
            example:
              agent_id: ag_01jb8x4m2fe0bv3c7y1tq9k2rd
      responses:
        '200':
          description: The agent is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empty'
        '400': {$ref: '#/components/responses/Refusal'}
        '401': {$ref: '#/components/responses/Refusal'}
        '403': {$ref: '#/components/responses/Refusal'}
        '404': {$ref: '#/components/responses/Refusal'}
        '409': {$ref: '#/components/responses/Refusal'}
        '429': {$ref: '#/components/responses/Refusal'}
        '500': {$ref: '#/components/responses/Refusal'}
  /api/v1/agent.list:
    post:
      operationId: listAgents
      summary: List the agents this provisioner created
      description: |
        Every agent this provisioner created, newest first. An empty `agents`
        list means it has created none, not that the call failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAgentsRequest'
            example:
              cursor: ''
      responses:
        '200':
          description: A page of agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPage'
              example:
                agents:
                  - agent_id: ag_01jb8x4m2fe0bv3c7y1tq9k2rd
                    name: Ticket 4411 triage
                    address: triage-4411@k3x9.noetiveagents.com
                    bud_scopes: [mail]
                    key_id: key_01jb8x4m3ae0bv3c8m5n7r2wxz
                    disabled: false
                    created_at: '2026-10-27T09:00:00Z'
                next_cursor: ''
        '400': {$ref: '#/components/responses/Refusal'}
        '401': {$ref: '#/components/responses/Refusal'}
        '403': {$ref: '#/components/responses/Refusal'}
        '429': {$ref: '#/components/responses/Refusal'}
        '500': {$ref: '#/components/responses/Refusal'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A key (`keya_…`) whose agent has **May create agents and keys**.
        Pass as `Authorization: Bearer <key>`.
  responses:
    Refusal:
      description: The request was refused. `code` says why.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Refusal'
          example:
            code: local_part_taken
            error: That address is already in use.
            agent_id: ag_01jb8x4m2fe0bv3c7y1tq9k2rd
  schemas:
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Shown in the dashboard. Unique in the account, ignoring case.
        local_part:
          type: string
          maxLength: 64
          description: |
            The part of the address before the `@`: lowercase letters, digits
            and `.`, `_`, `+`, `-`. Generated when omitted. Fixed once
            created, because it is in the From of every message the agent
            sends.
        bud_scopes:
          type: array
          items:
            type: string
            enum: [mail]
          description: |
            What the agent may do in Bud. Defaults to the provisioner's own.
            Must be among the provisioner's own.
        namespaces:
          $ref: '#/components/schemas/NamespaceAccess'
        expires_in_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: When the key stops working. `0` or omitted means never.
    NamespaceAccess:
      type: object
      additionalProperties: false
      required: [scope]
      description: |
        Which Semantik namespaces the agent reaches. Omitted means none. Must
        be within what the provisioner reaches.
      properties:
        scope:
          type: string
          enum: [all, selected]
          description: |
            `all` reaches every namespace in the account, present and future,
            and needs a provisioner whose own scope is `all`. `selected`
            reaches exactly `ids`.
        ids:
          type: array
          items:
            type: string
          description: Namespace ids, under `selected`.
        include_globals:
          type: boolean
          description: Whether the agent also reaches the shared `global` namespace.
    CreatedAgent:
      type: object
      required: [agent_id, address, key_id, key, expires_at]
      properties:
        agent_id:
          type: string
        address:
          type: string
          description: The agent's email address. Empty when it has no Bud scopes, and so no mailbox.
        key_id:
          type: string
          description: The key's id, for `key.revoke`. Not a secret.
        key:
          type: string
          description: The key itself. Shown once.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the key stops working; null when it never does.
    RotateKeyRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id:
          type: string
        grace:
          type: string
          enum: [now, 1h, 24h, 7d]
          description: How long the agent's current key keeps working. Defaults to `now`.
        expires_in_days:
          type: integer
          minimum: 0
          maximum: 3650
          description: When the new key stops working. `0` or omitted means never.
    RotatedKey:
      type: object
      required: [key_id, key, address, expires_at, previous_key_valid_until]
      properties:
        key_id:
          type: string
        key:
          type: string
          description: The new key. Shown once.
        address:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        previous_key_valid_until:
          type: string
          format: date-time
          nullable: true
          description: When the replaced key stops; null when it already has.
    RevokeKeyRequest:
      type: object
      additionalProperties: false
      required: [key_id]
      properties:
        key_id:
          type: string
    DeleteAgentRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id:
          type: string
    ListAgentsRequest:
      type: object
      additionalProperties: false
      properties:
        cursor:
          type: string
          description: '`next_cursor` from the previous page; empty for the first.'
    AgentPage:
      type: object
      required: [agents, next_cursor]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ProvisionedAgent'
        next_cursor:
          type: string
          description: Empty on the last page.
    ProvisionedAgent:
      type: object
      required: [agent_id, name, address, bud_scopes, key_id, disabled, created_at]
      properties:
        agent_id:
          type: string
        name:
          type: string
        address:
          type: string
          description: Empty until the mailbox has been set up.
        bud_scopes:
          type: array
          items:
            type: string
        key_id:
          type: string
          description: The key the agent acts through; empty when it has none.
        disabled:
          type: boolean
          description: Disabled in the dashboard. Its keys work again once it is enabled.
        created_at:
          type: string
          format: date-time
    Empty:
      type: object
      additionalProperties: false
    Refusal:
      type: object
      required: [code, error]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - missing_credential
            - unauthorized
            - not_billable
            - not_a_provisioner
            - exceeds_provisioner
            - not_found
            - local_part_taken
            - name_taken
            - too_many_keys
            - conflict
            - rate_limited
            - mailbox_unavailable
            - internal_error
        error:
          type: string
          description: A sentence for a person. Do not branch on it.
        agent_id:
          type: string
          description: On `local_part_taken` and `name_taken`, the existing agent when this provisioner created it.
