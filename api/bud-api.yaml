openapi: 3.0.3
info:
  title: Noetive Bud API
  version: 0.1.0
  description: |
    Noetive Bud is email for AI agents. Each agent gets an address of its own
    and a mailbox it reaches through this API, with sending limits it can read
    and cannot raise.

    All request and response bodies are JSON. Every operation is a `POST`,
    including the ones that only read. The input is a document rather than a
    query string, so a caller assembles a typed body instead of encoding
    filters into a URL. `/v1/watch` accepts a JSON `POST` and upgrades the
    response to a Server-Sent Events stream.

    ## Four verbs over one way of naming things

    The operations below are four verbs: **watch** for what happens,
    **describe** and **list** to read, **update** to mark or label, and
    **send**. Each operation acts on one kind of object, and the object's
    identifier says which kind it is: `message_…`, `thread_…`, `ag_…` for an
    agent and its mailbox. An identifier of another kind is refused rather
    than guessed at.

    `POST /v1/help.describe` returns the naming grammar and what each kind
    accepts, and `POST /v1/catalog.describe` returns what this deployment
    serves. Both are cheap and neither needs anything but a valid credential.

    ## Identity and scope

    Every request carries a bearer credential, either an API key
    or an access token (a JWT the Noetive access service signed for this
    service). Both name one agent, an agent belongs to one workspace, and an
    agent reads and writes its own mailbox. A delegation from another agent may
    extend that to its mailbox, never beyond the workspace.

    An access token is a ceiling, not a grant: its scope can narrow what the
    agent may do and never widen it. A token that acts for a person rather than
    for the agent itself is refused on every operation with
    `impersonation_not_supported`.

    There is no operation on this surface that creates a workspace, an agent or
    a credential. Those are administrative and are not reachable with an agent
    credential.

    ## Errors

    A refusal is a JSON object with an `error` member, at the HTTP status the
    code maps to. The status is the part to branch on; the code is the part to
    branch within.

    | code | status | meaning |
    | --- | --- | --- |
    | `invalid` | 400 | The request is malformed or a field is wrong. `field` is a JSON pointer to it. |
    | `invalid` | 405 | The operation exists and takes `POST`. The `Allow` header says so. |
    | `unauthorized` | 401 | The credential is missing, unknown, revoked or expired. |
    | `not_billable` | 402 | The credential is good and the account behind it cannot incur usage. |
    | `spend_cap_reached` | 402 | A spend cap on the organization, tenant or agent has been reached. Raise the cap or wait for its period; the payment method is not the problem. |
    | `forbidden_scope` | 403 | The credential is valid and its agent is disabled, its account is not active, or it may not watch the mailbox, send, or send as the sender it named. |
    | `impersonation_not_supported` | 403 | The token acts for a person, and no operation accepts that yet. |
    | `approval_required` | 403 | A person has to approve this action before it can happen, and this operation cannot wait for one (a read). A send is never refused with this: it comes back `held`. |
    | `not_found` | 404 | No such object, an object this credential does not reach, or no such operation. |
    | `precondition_failed` | 409 | The object is not in a state this write applies to: another write kept landing first, a message is still arriving, a folder still holds mail, or a mailbox has all the folders it may. The hint says which. |
    | `policy_refused` | 422 | A policy declined. `guard` names which. |
    | `rate_limited` | 429 | A limit is spent. `counter` names which, and `retry_after_ms` says how long to wait when waiting helps. |
    | `quota_exceeded` | 429 | A usage quota for the period is used up. Waiting a second does not help; `counter` names which and `retry_after_ms` says when the window refills. |
    | `paused` | 409 | The mailbox is paused and is not sending. Shares 409 with `precondition_failed`; the code tells them apart. |
    | `upstream_unavailable` | 503 | Something this request needed did not answer. Retry with backoff. |
    | `policy_unavailable` | 503 | The policy that governs this caller could not be applied, so nothing was done. Retry with backoff. |
    | `unavailable` | 404 | This deployment does not serve this option of the operation. Do not retry it. |
    | `internal` | 500 | Something went wrong that is not about the request. |

    An object this credential cannot reach is answered exactly as one that
    does not exist, so a refusal never discloses what another account holds.

    Every response, successful or not, carries an `X-Request-Id` header, and a
    refusal repeats it as `error.request_id`. Quote it in a support request: it
    correlates the refusal with everything the request caused.

    No refusal a caller can provoke is a 5xx. `unavailable` and `paused` are
    answered with a 4xx, because a 5xx means this service failed and is what
    its own health signals count; within one status, branch on the code.

    ### Only 401 means the credential is the problem

    Several refusals concern the credential's surroundings rather than the
    credential, and only one of them is worth minting a new key over.

    Treat **401** as "this key never works": stop presenting it. `403`,
    `402`, `429` and `503` all mean the key itself is fine. It
    reaches no agent here, or the account cannot currently incur usage, or
    something the request needed did not answer. A client that reacts to those
    by discarding the key throws away a working credential and gets no further,
    which is why they are separate statuses and why `WWW-Authenticate` is sent
    with the 401 and with nothing else. Branch on the header's presence if that
    is easier than branching on the status.

    `upstream_unavailable` and `policy_unavailable` are the ones to retry. They
    are transient by definition, and the request had no effect.

    ## Limits

    | limit | value |
    | --- | --- |
    | request body | 1 MiB |
    | JSON nesting depth | 64 |
    | requests in flight per agent | a small fixed number; past it, `429 rate_limited` |

    A body over the limit is refused as `invalid` with a JSON envelope, not as
    a bare transport error, so one error path covers size and shape alike.

    ## Concurrency

    There are no versions to quote. `message.update` changes read state and
    labels, and its `labels` replace the message's labels whole, so two agents
    labelling one message at once keep the last write.

    ## Idempotency

    `send` and `message.update` accept `idempotency_key`. A repeat with the
    same key returns the first attempt's result rather than doing the work
    again. A repeat that arrives while the first attempt is still running is
    refused as `rate_limited`, with `retry_after_ms` saying when to ask again.
    A key belongs to the agent that sent it, and a refused or failed attempt
    does not spend it.

    | operation | a repeat with the same key |
    | --- | --- |
    | `send` | returns the first send's result for seven days, through restarts, deployments and outages |
    | `message.update` | is recognised on a best-effort basis for up to an hour |

    For `message.update`, a key can be forgotten sooner: after a service
    interruption, or while the service is under heavy load. A forgotten key
    does the work again, exactly as if no key had been sent; it never returns
    the result of a different request. Marking read and replacing labels are
    safe to repeat, so a forgotten key costs nothing but the call.

    A key names one request. Never reuse one for a different request: on
    `message.update` such a reuse is refused as `invalid`, and on `send` it
    returns the first send's result and sends nothing.

servers:
  - url: https://bud.noetive.io
    description: Bud endpoint

security:
  - bearerAuth: []

tags:
  - name: Mail
    description: Read, file and reply to messages.
  - name: Send
    description: Compose and send.
  - name: Attachments
    description: Parts of received messages.
  - name: Events
    description: The live stream of what happened.
  - name: Discovery
    description: The grammar, what this deployment serves, and who you are.
  - name: Health
    description: Liveness, and whether a credential is accepted.

paths:
  # ── Mail ─────────────────────────────────────────────────────────
  /v1/folder.list:
    post:
      operationId: listFolder
      tags: [Mail]
      summary: List a folder
      description: |
        Messages in one folder of one mailbox, oldest first, in the order they
        were filed. `folder` is `inbox` (the default), `sent`, `quarantine`, or
        a folder the mailbox made with folder.create. A folder the mailbox does
        not have is a `404`, never an empty listing. A message moved into a
        folder is filed after everything already there.

        Use `cursor` to page. A listing is stable: a message that arrives
        mid-page is filed after everything you have already seen, so it
        appears on a later page rather than shuffling this one.

        `limit` bounds how many messages are examined, not how many match. With
        a filter, a page can come back short or empty and still carry a
        `cursor`: keep paging until there is none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderListRequest'
      responses:
        '200':
          $ref: '#/components/responses/Read'
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/folder.create:
    post:
      operationId: createFolder
      tags: [Mail]
      summary: Make a folder
      description: |
        Make a folder in a mailbox to file mail in with message.update. Making
        one that already exists changes nothing and reports no effect, so the
        call is safe to repeat. A mailbox has at most 32 folders of its own;
        past that the call is a `409` until one is removed. `inbox`,
        `quarantine` and `sent` always exist and cannot be made.

        Only the mailbox's own agent can make or remove its folders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderWriteRequest'
      responses:
        '200': { $ref: '#/components/responses/Write' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/folder.delete:
    post:
      operationId: deleteFolder
      tags: [Mail]
      summary: Remove a folder
      description: |
        Remove a folder the mailbox made. Only an empty folder is removed: one
        that still holds mail is a `409`, and nothing changes until its mail is
        moved elsewhere, so no message is ever left in a folder that no longer
        exists. Removing one that is already gone reports no effect.
        A message moved into the folder at the moment it is removed goes to
        `inbox` instead, journalled as a `mail.moved` whose actor is the
        server.        `inbox`, `quarantine` and `sent` cannot be removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderWriteRequest'
      responses:
        '200': { $ref: '#/components/responses/Write' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/message.describe:
    post:
      operationId: describeMessage
      tags: [Mail]
      summary: Read one message
      description: |
        The message, rendered for reading and structured for parsing.

        `provenance` reports what authentication the message arrived with and
        what was removed from it. Read it before treating the content as
        trustworthy: a message that failed authentication is placed and
        rendered like any other, and the verdict is the only thing that says
        so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeMessageRequest'
      responses:
        '200': { $ref: '#/components/responses/Read' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/message.update:
    post:
      operationId: updateMessage
      tags: [Mail]
      summary: Mark, label or move a message
      description: |
        Mark a message read, replace its labels, or move it to another folder
        of its mailbox. `effects` in the result says what changed; a change
        that was already true reports nothing.

        A move takes received mail between `inbox`, `quarantine` and the
        folders made with folder.create. Sent mail stays in `sent`. Moving a
        message out of `quarantine` files it elsewhere and does not change how
        it was authenticated: the provenance it is shown with is the same, and
        replying to it is refused as before.

        The changes in one request apply in order — read, then labels, then
        folder — and are not one transaction: a refused move leaves a read or
        label change from the same request applied. A move is journalled as
        `mail.moved` once it is complete, which may be just after this
        response. If the request fails after the move was recorded, repeating
        it finishes the move and its event, and reports no effect because
        the message is already where it was asked to go.
        A `409` means other label writes kept landing first. A `read` change in
        the same request may already have been applied; the request is safe to
        repeat as it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
      responses:
        '200': { $ref: '#/components/responses/Write' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/thread.describe:
    post:
      operationId: describeThread
      tags: [Mail]
      summary: Read a conversation
      description: |
        The conversation's most recent messages, rendered in the order they
        were sent. Each message is cut at 4000 characters; read one with
        message.describe for the whole of it. `truncated` says that older
        messages were left out, not that one was cut.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeThreadRequest'
      responses:
        '200': { $ref: '#/components/responses/Read' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/mailbox.describe:
    post:
      operationId: describeMailbox
      tags: [Mail]
      summary: Describe a mailbox
      description: |
        Its addresses (the first is the default), its folders with how many
        messages each holds — the folders it made included, empty or not —
        its limits, and what it is currently allowed to send.
        `sending` carries the same status as me.describe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeMailboxRequest'
      responses:
        '200': { $ref: '#/components/responses/Read' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/correspondent.list:
    post:
      operationId: listCorrespondents
      tags: [Mail]
      summary: List correspondents
      description: |
        Who this mailbox has exchanged mail with, and how much. This is what
        makes "have you spoken before" answerable without reading the archive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrespondentListRequest'
      responses:
        '200': { $ref: '#/components/responses/Read' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  # ── Send ─────────────────────────────────────────────────────────
  /v1/send:
    post:
      operationId: send
      tags: [Send]
      summary: Send a message
      description: |
        Compose and send, or reply. The reply form computes recipients from the
        message being replied to rather than making the caller reconstruct
        them from a rendering: a rendering is partly what a sender chose.

        A send is subject to the mailbox's limits and policy. Three outcomes
        are normal and distinguishable: it is `queued`; it is `held`, because
        a rule of the workspace's policy needs a person to approve it first
        (the result carries `approval_id`, and the message goes out when a
        person approves it and never otherwise); or it is refused with
        `422 policy_refused` and `guard` naming the rule that fired. A held
        message has spent its sending budget; the budget is given back if it
        is rejected or lapses. Nothing you can send releases a held message:
        only a person the workspace named can, so do not resend it. If the
        policy that governs the sender cannot be applied the send is refused
        with `503 policy_unavailable` and nothing is done. A refusal is not
        worth retrying unchanged.

        Pass `idempotency_key` on every send. Without one, a timeout you retry
        is a second message.

        `remaining` in the result is what is left of each sending limit, so an
        agent can pace itself rather than discover a limit by reaching it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '200': { $ref: '#/components/responses/Send' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Paused' }
        '422': { $ref: '#/components/responses/PolicyRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  # ── Attachments ──────────────────────────────────────────────────
  /v1/part.describe:
    post:
      operationId: describePart
      tags: [Attachments]
      summary: Read one part of a message
      description: |
        An attachment or a body part, returned inline.

        `mode: text` (the default) renders a part that is already text —
        `text/*`, JSON, XML, a forwarded message — the way a message body is
        rendered, under the same banner and with the same defences; HTML is
        converted to text. At most the first 2 MiB of the part is read: a longer
        one comes back cut, with `truncated`, and there is no cursor to continue
        from. Any other type is `unavailable` in this mode: read it with
        `mode: bytes`.

        `mode: bytes` returns the part's decoded bytes, standard base64, as
        `content.bytes_base64`, beside its `type`, `filename` and `size`. A part too large to return whole is refused with
        `422 policy_refused` and `guard: part_size` rather than cut short. A
        message withheld because it carries malware refuses every part, in
        either mode, with `guard: virus`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribePartRequest'
      responses:
        '200': { $ref: '#/components/responses/Read' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/PolicyRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  # ── Events ───────────────────────────────────────────────────────
  /v1/watch:
    post:
      operationId: watch
      tags: [Events]
      summary: Stream events as they happen
      description: |
        Opens a Server-Sent Events stream of everything that happens in the
        mailboxes this credential can read: mail arriving, a send leaving, a
        delivery outcome returning.

        Pass the `cursor` from the last frame you processed to resume exactly
        where you stopped. An empty cursor starts at the tail, which is what a
        fresh client wants: one cheap call for a usable cursor instead of
        replaying history.

        Every frame carries a cursor, and each event carries `seq`, its
        position in its mailbox. Store a frame's cursor only after you have
        acted on its events, or a crash between the two loses them.

        The stream is three kinds of line. It always starts with an `open`
        frame carrying the cursor the stream starts from: yours, re-encoded for
        the mailboxes in scope, with the current tail for every mailbox it does
        not name. Store it, and a reconnect misses nothing even if no `batch`
        ever arrived. Each `batch` frame carries events and the cursor after
        them. A `: keepalive` comment arrives while nothing is happening, so a
        silent connection is distinguishable from a dead one.

        The `data` of an `open` frame is a `WatchOpenFrame`, and of a `batch`
        frame a `WatchBatchFrame`.

        A request that is wrong is refused before the stream opens, with an
        ordinary JSON error: a cursor that does not parse or an unknown event
        type is `400`, a mailbox this credential cannot read is `403`. An error
        after `open` is a failure in flight, arrives as a `batch` frame
        carrying `error` and the cursor the stream had reached, and ends the
        stream: store that cursor and reconnect with it.

        It stays open until you disconnect or the server is replaced; reconnect
        with your last cursor and nothing is lost.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchRequest'
      responses:
        '200':
          description: An SSE stream of events.
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: The open frame, a keepalive and two batches
                  value: |
                    event: open
                    data: {"cursor":"41"}

                    : keepalive

                    event: batch
                    data: {"cursor":"42","events":[{"id":"journal_...","workspace":"workspace_...","ts":"2026-01-02T15:04:05Z","seq":42,"type":"mail.received","mailbox":"ag_...","message":"message_...","thread":"thread_...","actor":{"kind":"system","agent":""},"data":{"from":"anna@example.net","subject":"Order #1234","aligned":true,"folder":"inbox"}}]}

                    event: batch
                    data: {"cursor":"43","events":[{"id":"journal_...","workspace":"workspace_...","ts":"2026-01-02T15:04:09Z","seq":43,"type":"mail.sent","mailbox":"ag_...","message":"message_...","thread":"thread_...","actor":{"kind":"agent","agent":"ag_..."},"data":{"state":"sent"}}]}
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  # ── Discovery ────────────────────────────────────────────────────
  /v1/me.describe:
    post:
      operationId: describeMe
      tags: [Discovery]
      summary: Who this credential is
      description: |
        The agent, its addresses, its mailbox, and what it may reach. The
        first call a client should make.

        `sending` says whether mail sent now goes out now: `ready`,
        `provisioning` while the sending domain verifies (mail is accepted and
        waits), or `paused` by an operator (a send is refused), with a
        `reason`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { $ref: '#/components/responses/Read' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/addressbook.describe:
    post:
      operationId: describeAddressbook
      tags: [Discovery]
      summary: The workspace addressbook
      description: |
        Every agent in your workspace that has a mailbox, and the addresses
        that reach it, so an agent can write to a colleague by name. Built from the workspace's own
        agents on every call: nothing a sender writes can add an entry, and a
        disabled or deleted agent is not listed. Your own entry is marked
        `self`. Needs the `book` scope.

        `addresses` send and receive, the first being the one the agent sends
        from; `receive_only` addresses deliver to the agent and are never sent
        from.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressbookRequest'
      responses:
        '200': { $ref: '#/components/responses/Read' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/help.describe:
    post:
      operationId: describeHelp
      tags: [Discovery]
      summary: The grammar
      description: |
        Every kind of thing that can be named, what each accepts, and the body
        each write takes. Written to be read by a model as well as a person.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { $ref: '#/components/responses/Read' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /v1/catalog.describe:
    post:
      operationId: describeCatalog
      tags: [Discovery]
      summary: What this deployment serves
      description: |
        Each kind, whether it can be read, and whether this deployment serves
        it. Ask this rather than discovering a refusal in the middle of a task.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  # ── Health ───────────────────────────────────────────────────────
  /v1/health:
    post:
      operationId: checkCredential
      tags: [Health]
      summary: Whether this credential is accepted
      description: |
        Distinct from `GET /health`, which answers whether the service is up.
        This answers whether *your* credential works, which is the question a
        client actually has at start-up.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: The credential is accepted.
          content:
            application/json:
              schema:
                type: object
                required: [contract, agent, workspace]
                properties:
                  contract:
                    type: string
                    description: The version of this API the deployment speaks.
                  agent:
                    type: string
                    description: The agent this credential is.
                    example: ag_01j9x2v8k3e0080000000000
                  workspace:
                    type: string
                    description: The account the agent belongs to.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/NotBillable' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /health:
    get:
      operationId: health
      tags: [Health]
      summary: Liveness
      description: Whether the service is answering. No credential required.
      security: []
      responses:
        '200':
          description: The service is answering.

  /ready:
    get:
      operationId: ready
      tags: [Health]
      summary: Readiness
      description: |
        Whether this instance has finished starting. It deliberately does not
        report on anything the service itself depends on.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
        '503':
          description: Still starting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not_ready }
                  reason: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer credential for one agent: an API key or an access
        token (a JWT). Pass as `Authorization: Bearer <credential>`.

        A key is shown once when it is issued and is not recoverable
        afterwards; an access token lives five minutes and is fetched with the
        agent's own client key from the access service. Treat both as secrets:
        they reach one agent's mail, and anything a delegation has extended to
        it. An access token's scope is a ceiling on what the agent may do with
        it.

  schemas:
    DescribeMessageRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: |
            The message, by its identifier. The identifier says which kind it
            is, so there is no second field to route on, and an identifier of
            the wrong kind is refused rather than guessed at.
          example: message_01j9x2v8k3e0080000000000
        render:
          type: string
          enum: [text, raw, parts]
          description: |
            `text` (the default) is the safe rendering. `raw` is the original
            message as it arrived. `parts` lists its structure, with the part
            numbers part.describe takes.
        max_chars:
          type: integer
          description: |
            Truncate the rendering. At most, and by default, 20000. A truncated
            response carries `truncated` and a `cursor` to continue from,
            rather than silently stopping. Ignored with `render: raw`.
        cursor:
          type: string
          description: Continue a truncated rendering.
        quoted:
          type: boolean
          description: |
            Not served: quoted history stays folded, and asking for it is
            `unavailable`. Read with `render: raw` for the original.

    DescribeThreadRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The conversation, by its identifier.
          example: thread_01j9x2v8k3e0080000000000
        max_messages:
          type: integer
          description: |
            How many of the most recent messages to render. Default 20, at
            most 50.

    DescribePartRequest:
      type: object
      required: [id, part]
      properties:
        id:
          type: string
          description: The message the part belongs to.
          example: message_01j9x2v8k3e0080000000000
        part:
          type: string
          description: |
            The part number, as `render: parts` on message.describe lists it.
          example: '2'
        mode:
          type: string
          enum: [text, bytes, message]
          description: |
            `text` (the default) or `bytes`; see the operation. `message`, to
            read a forwarded message as its own object, is `unavailable`.

    DescribeMailboxRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The agent whose mailbox to describe.
          example: ag_01j9x2v8k3e0080000000000

    FolderListRequest:
      type: object
      required: [in]
      properties:
        in:
          type: string
          description: The mailbox, by its agent's identifier.
          example: ag_01j9x2v8k3e0080000000000
        folder:
          $ref: '#/components/schemas/FolderName'
        unread:
          type: boolean
          description: |
            `true` for only messages not yet marked read. `false` is no filter,
            the same as leaving it out.
        agent:
          type: boolean
          description: |
            `true` for only messages carrying a machine-readable part. `false`
            is no filter, the same as leaving it out.
        since:
          type: string
          format: date-time
          description: |
            Only messages dated at or after this instant, RFC 3339. Anything
            else is refused rather than read as a different window.
        before:
          type: string
          format: date-time
          description: Only messages dated before this instant, RFC 3339.
        from:
          type: string
          description: Only messages from this address.
        thread:
          type: string
          description: Only messages in this conversation.
          example: thread_01j9x2v8k3e0080000000000
        limit:
          type: integer
          description: |
            How many messages to examine for this page. Default 50, at most
            200; a larger value is treated as 200.
        cursor:
          type: string
          description: |
            Resume a listing. Pass back, unchanged, the `cursor` a previous
            page of the same operation returned; cursors are opaque, and one
            operation's cursor means nothing to another.

    AddressbookRequest:
      type: object
      properties:
        q:
          type: string
          description: Only agents whose name or an address contains this text, ignoring case.
        limit:
          type: integer
          description: How many agents to return. Default 50, at most 200.
        cursor:
          type: string
          description: Resume a listing, from the `cursor` the last page returned.

    CorrespondentListRequest:
      type: object
      required: [in]
      properties:
        in:
          type: string
          description: The mailbox, by its agent's identifier.
          example: ag_01j9x2v8k3e0080000000000
        q:
          type: string
          description: Only addresses containing this text, ignoring case.
        limit:
          type: integer
          description: |
            How many correspondents to examine for this page. Default 50, at
            most 200. With `q`, a page can come back short or empty and still
            carry a `cursor`: keep paging until there is none.
        cursor:
          type: string
          description: Resume a listing, from the `cursor` the last page returned.

    FolderName:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]{0,47}$'
      description: |
        `inbox`, `quarantine`, `sent`, or a folder the mailbox made: lowercase
        letters, digits and hyphens, at most 48 characters, not `corr` or
        `unread`.
      example: receipts

    FolderWriteRequest:
      type: object
      required: [in, folder]
      properties:
        in:
          type: string
          description: The mailbox, by its agent's identifier.
          example: ag_01j9x2v8k3e0080000000000
        folder:
          $ref: '#/components/schemas/FolderName'
        idempotency_key:
          type: string

    UpdateRequest:
      type: object
      required: [id, changes]
      properties:
        id:
          type: string
          description: The message to change.
          example: message_01j9x2v8k3e0080000000000
        changes:
          type: object
          description: The fields to change. At least one.
          properties:
            read:
              type: boolean
              description: Mark the message read, or unread.
            labels:
              type: array
              items: { type: string }
              description: |
                The message's labels, whole. Replaces what is there, so an
                empty list removes them all.
            folder:
              $ref: '#/components/schemas/FolderName'
        idempotency_key:
          type: string

    SendRequest:
      type: object
      properties:
        to:
          type: array
          items: { type: string }
          description: |
            Recipients. May be omitted on a reply, which takes them from the
            message being replied to. A send with no recipients at all is
            refused.
        cc:
          type: array
          items: { type: string }
        bcc:
          type: array
          items: { type: string }
        from:
          type: string
          description: |
            Which of the agent's addresses to send as. Empty takes its
            primary address.
        on_behalf_of:
          type: string
          description: |
            Send as another agent, which needs a send-on-behalf grant from
            that agent's owner, the organization's permission for sending on
            behalf, and a From domain verified for the workspace. Without all
            three the send is refused with `422 policy_refused`. The message
            then names both, with the sending agent in `Sender`, so a
            recipient can see who wrote it and who it is from.
        subject:
          type: string
        text:
          type: string
          description: The plain-text body.
        html:
          type: string
          description: |
            An alternative to `text`, not a replacement for it. A message with
            no plain part is one the reader on the other side has to render
            before it can read it.
        in_reply_to:
          type: string
          description: |
            The message this replies to. It is what puts the reply in a
            conversation.
          example: message_01j9x2v8k3e0080000000000
        reply_all:
          type: boolean
          description: |
            Compute recipients from the message being replied to, minus the
            caller's own addresses.
        agent:
          $ref: '#/components/schemas/AgentPart'
        idempotency_key:
          type: string
          description: |
            Strongly recommended. A repeat with the same key returns the first
            attempt's result rather than sending a second message.

    AgentPart:
      type: object
      description: |
        A machine-readable part, for an exchange between two agents. It travels
        with the message beside the text, and the receiving side can filter on
        it. Keys outside this shape are dropped, not carried.
      properties:
        bud:
          type: integer
          description: The version of this envelope, carried as sent.
        intent:
          type: string
          description: What this message asks of the recipient.
        corr:
          type: string
          description: Your identifier for this exchange.
        in_reply_to_corr:
          type: string
          description: The `corr` of the message this answers.
        schema:
          type: string
          description: Names the shape of `payload`.
        hops:
          type: integer
          description: |
            How many messages this exchange has taken so far. Send the count
            from the message you are answering: the server adds one to it
            before the message leaves, and a mailbox's policy bounds it.
        payload:
          description: The content, as any JSON value.
        expect:
          description: Not carried by this server, and refused if present.

    WatchRequest:
      type: object
      properties:
        cursor:
          type: string
          description: |
            Where to resume. Empty starts at the tail.
        mailbox:
          type: string
          description: |
            Narrow to one mailbox. Empty means every mailbox this credential
            can read.
          example: ag_01j9x2v8k3e0080000000000
        timeout_s:
          type: integer
          description: |
            How long each quiet interval lasts before a keepalive is sent, in
            seconds, at most 25. It does not end the stream.
        types:
          type: array
          items: { $ref: '#/components/schemas/EventType' }
          description: |
            Only these event types. Empty matches everything; an unknown type
            is refused.
          example: [mail.received, mail.bounced]
        agent_part:
          type: boolean
          description: |
            `true` for only messages carrying a machine-readable part, `false`
            for only messages without one. Absent matches both.

    WatchOpenFrame:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: string
          description: Where this stream starts. Store it.

    WatchBatchFrame:
      type: object
      required: [cursor]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        cursor:
          type: string
          description: Where the stream stands after these events.
        error:
          $ref: '#/components/schemas/Error'

    EventType:
      type: string
      enum:
        - mail.received
        - mail.quarantined
        - mail.queued
        - mail.held
        - mail.approved
        - mail.rejected
        - mail.sent
        - mail.delivered
        - mail.bounced
        - mail.complained
        - mail.read
        - mail.moved
        - render.failed
      description: |
        `mail.received` and `mail.quarantined` are mail arriving, the second
        filed in quarantine. `mail.queued`, `mail.held`, `mail.approved`, `mail.rejected`,
        `mail.sent`, `mail.delivered`, `mail.bounced` and `mail.complained`
        follow a send: accepted, held for a person, released by a person,
        refused or lapsed while held (the budget is given back), handed to the
        provider, accepted by the receiving side, refused for good, reported as
        unwanted. `mail.read` is a message marked read or unread. `mail.moved`
        is a message filed in another folder; its `folder` is where it went,
        while the folder on `mail.received` is where it arrived. Its actor is
        the agent that moved it, or the server when a removed folder sent the
        message back to `inbox`.
        `render.failed` means a rendering was withheld as unsafe and a
        degraded one shown instead.

    Event:
      type: object
      description: |
        One thing that happened. It carries metadata, never content: what
        little a sender chose (`from`, `subject`) is capped and sanitised.
      required: [id, seq, type, mailbox]
      properties:
        id:
          type: string
        workspace:
          type: string
          description: The account it happened in.
        ts:
          type: string
          format: date-time
        seq:
          type: integer
          description: Its position in its mailbox's sequence of events.
        type:
          $ref: '#/components/schemas/EventType'
        mailbox:
          type: string
        message:
          type: string
          description: The message it is about, if any; empty otherwise.
        thread:
          type: string
          description: The conversation it is about, if any; empty otherwise.
        actor:
          type: object
          properties:
            kind:
              type: string
              enum: [system, agent, operator]
            agent:
              type: string
              description: The agent that acted, when `kind` is `agent`.
        corr:
          type: string
          description: |
            Ties this event to the request that caused it and to the other
            events that request caused.
        data:
          type: object
          properties:
            from: { type: string }
            subject: { type: string }
            aligned: { type: boolean }
            in_workspace: { type: boolean }
            known: { type: boolean }
            agent_part: { type: boolean }
            folder: { type: string }
            guard: { type: string }
            counter: { type: string }
            reason: { type: string }
            state: { type: string }
            provider:
              type: string
              description: An opaque delivery reference for a message that was handed on.
            message_id:
              type: string
              description: |
                On `mail.sent`, the Message-ID the message went out under: the
                one a recipient sees and quotes back in a reply.

    ReadResult:
      type: object
      properties:
        ref:
          type: string
          description: What was read, as the server understood it.
        kind:
          type: string
          description: Which shape this is, so a client can branch without re-parsing.
        text:
          type: string
          description: The rendering, for the kinds that have one.
        content:
          type: object
          description: |
            The structured form, for the kinds that have one. Its shape depends
            on `kind`.
        provenance:
          $ref: '#/components/schemas/Provenance'
        cursor:
          type: string
          description: Present when there is more to read.
        truncated:
          type: boolean
          description: There is more than this response carries.
        error:
          $ref: '#/components/schemas/Error'

    WriteResult:
      type: object
      properties:
        ref:
          type: string
        created:
          type: boolean
        effects:
          type: array
          description: What the write changed.
          items:
            type: object
            required: [kind]
            properties:
              kind:
                type: string
                enum: [mail.read, labelled, moved, folder.created, folder.deleted]
              count:
                type: integer
              ref:
                type: string
        error:
          $ref: '#/components/schemas/Error'

    SendResult:
      type: object
      properties:
        state:
          type: string
          enum: [queued, sending, sent, delivered, bounced, failed, held, rejected]
          description: |
            A new send is `queued`: accepted for delivery, returned as soon as
            the message is durably queued and before it is handed on. A repeat
            with the same `idempotency_key` reports the message's state now,
            which may be any later one. `held` is a message waiting for a
            person to approve it, with `approval_id`; it becomes `queued` when
            approved and `rejected` when a person refuses it or the wait
            lapses. A send that a guard refuses comes back as an error
            instead of a result.
        approval_id:
          type: string
          description: |
            The approval a held message is waiting on. Absent until the request
            for approval has been filed, which is retried in the background;
            the message is held either way.
        message:
          type: string
          description: The message's identifier.
        thread:
          type: string
          description: The conversation it belongs to.
        reason:
          type: string
          description: |
            On a queued message, why it waits instead of going now:
            `provisioning` while the sender's domain is being verified (it goes
            out once it is), or `paused`. On a repeat for a message that
            failed, why it failed. Absent when nothing is in the way.
        remaining:
          type: object
          additionalProperties: { type: integer }
          description: |
            What is left of each sending limit this send counted against, by
            limit name.
        error:
          $ref: '#/components/schemas/Error'

    Provenance:
      type: object
      description: |
        Where the content came from. Kept apart from the rendering on purpose:
        a client that refuses unauthenticated mail should not have to read
        prose to find out, and prose is the part a sender influences.
      required: [aligned, in_workspace, known]
      properties:
        spf:
          type: string
          description: The SPF verdict the message arrived with.
        dkim:
          type: string
          description: |
            `pass` when a DKIM signature verified; otherwise the result of the
            check, such as `fail` or `none`.
        dmarc:
          type: string
          description: The DMARC verdict the message arrived with.
        aligned:
          type: boolean
          description: |
            The authenticated domain matches the visible sender. The one to
            gate on.
        in_workspace:
          type: boolean
          description: |
            Sent, demonstrably, from an address of another agent in the same
            account.
        known:
          type: boolean
          description: This mailbox has exchanged mail with the sender before.
        thread_join:
          type: string
          enum: [new, verified, claimed]
          description: |
            How the message joined its conversation: it started one, it is a
            reply from someone the conversation already involves, or it only
            claims to be a reply.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid
            - unauthorized
            - not_billable
            - spend_cap_reached
            - forbidden_scope
            - impersonation_not_supported
            - approval_required
            - not_found
            - precondition_failed
            - policy_refused
            - rate_limited
            - quota_exceeded
            - paused
            - upstream_unavailable
            - policy_unavailable
            - unavailable
            - internal
        message:
          type: string
          description: What went wrong, in one sentence.
        hint:
          type: string
          description: What to do about it.
        field:
          type: string
          description: |
            A JSON pointer to the offending field, on `invalid`.
          example: /id
        guard:
          type: string
          description: Which rule refused, on `policy_refused`.
        counter:
          type: string
          description: Which limit is spent, on `rate_limited`.
        request_id:
          type: string
          description: |
            Correlates this refusal with everything the request caused. The
            same value is on the `X-Request-Id` header. Quote it in a support
            request.
        retry_after_ms:
          type: integer
          description: |
            How long to wait, on `rate_limited`. Absent when waiting will not
            help, such as a send with more recipients than the limit allows.

    ErrorEnvelope:
      type: object
      required: [error]
      description: |
        A refusal. It may also carry the `ref` and `kind` that were asked for.
      properties:
        error:
          $ref: '#/components/schemas/Error'
        ref:
          type: string
        kind:
          type: string

  responses:
    Read:
      description: The object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReadResult'
    Write:
      description: The write was applied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WriteResult'
    Send:
      description: |
        The send was accepted for delivery. A `200` here does not mean the
        message left — a guard that would refuse it does so as an error
        response instead, before this result is ever built.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SendResult'
    Invalid:
      description: The request is malformed, or a field is wrong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: |
        The credential is missing, unknown, revoked or expired. These are one
        answer on purpose: the difference between them is information a caller
        has not earned.

        This is the only refusal that means the credential itself does not
        work. Stop presenting it.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: |
            Present so a client knows to fetch a token rather than retry. Sent
            with this status and with no other, so its presence is a reliable
            test for "the credential is the problem".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotBillable:
      description: |
        The credential is good and the account behind it cannot incur usage.
        Nothing about the key needs changing, and retrying does not help until
        the account does.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: |
        The credential is valid and does not reach what was asked for: its agent
        is disabled or not on this service, it may not watch the mailbox it
        named, or it may not send as the sender it named. The key is fine; its
        reach is not. An object or mailbox it cannot read is answered `404`,
        not this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamUnavailable:
      description: |
        Something this request needed did not answer. The credential is fine,
        the request had no effect, and it is worth retrying with backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: |
        No such object, or no such operation — or, with code `unavailable`, an
        option of the operation this deployment does not serve. Do not retry
        an `unavailable`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: |
        The object is not in a state this write applies to: other writes kept
        landing first, a message is still being delivered, a folder still
        holds mail, or a mailbox has as many folders as it may. The hint says
        which. Read it again and retry, so the retry is decided against what
        is stored now.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PolicyRefused:
      description: A policy declined. The message says which.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: |
        A limit is spent. `counter` names which, and `retry_after_ms` says how
        long to wait. Without `retry_after_ms`, waiting will not help: change
        the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Paused:
      description: |
        The mailbox is paused and is not sending.

        `paused` is a decision somebody made about this mailbox and does not
        change on retry. It shares 409 with `precondition_failed`, so branch on
        the `code` member: this is the case the error table means by "branch on
        the status, then within it on the code".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: |
        Something went wrong that is not about the request. The credential is
        fine; do not discard it. Quote `request_id` in a support request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
